# Excubitor catalog 断片 — このリポジトリが所有するサービス定義。
# Excubitor が ${ARS_ROOT} 配下を走査して集積する (Excubitor/catalog/FRAGMENTS.md)。
#
# 中央 catalog/services.yaml の撤去 (Excubitor: require service-owned definitions) に伴い、
# 旧 catalog にあった定義をそのまま移設したもの。
services:
  - code: cernere
    name: Cernere
    tier: saas
    project_code: cernere
    component: backend
    # 正本拠点は AWS (spec/plan/2026-10-11-aws-site-migration.md)。AWS の 8080 は synergos-relay が使うため 8086。
    port: 8086
    repo: LUDIARS/Cernere
    runtime: node
    # Excubitor の bootstrap は cwd = 本体 checkout の最上位を要求する (Excubitor src/bootstrap/catalog.ts)。
    cwd: ${ARS_ROOT}/Cernere
    # Keep a native Node root alive: npm.cmd as the root dies with the Windows launcher job.
    # 外部公開する本番なので tsx watch ではなく setup がビルドした server/dist を node で動かす
    # (spec/setup/public-exposure.md)。コードの反映は deploy (pull → setup のビルド → 再起動)。
    command: node --run start:server
    allow_hot_reload: false
    autostart: false
    env:
      LISTEN_PORT: "8086"
      # 開発用の詳細エラー・詳細ログ・本人確認オフを本番で使わせない (config.ts の isProduction)。
      # NODE_ENV は setup の npm install から devDependencies を外すので使わない。
      CERNERE_ENV: production
      # cloudflared → cernere-frontend (serve/index.mjs) はループバックから来る。その経路だけ CF-Connecting-IP を信用する。
      # 待受アドレス LISTEN_HOST は拠点の tailnet IP を含むので Vault で渡す (spec/setup/public-exposure.md)。
      CERNERE_TRUSTED_PROXIES: "127.0.0.1,::1"
      # Keep the active GLab recipients and allow Aedilis's, Tendentia's and Tokyo2070's Composite auth-code handoff.
      CERNERE_COMPOSITE_ALLOWED_ORIGINS: http://localhost:5187,https://glm.ai-run-do.com,https://glab.ai-run-do.com,https://ae.ai-run-do.com,https://tendentia.ai-run-do.com,http://127.0.0.1:4440,http://localhost:4440
    health:
      type: http
      url: http://127.0.0.1:8086/health
      interval_sec: 30
    # Secret env is injected from Excubitor's shared/project Vault bindings.
    # 全サービスへ配る Cernere の接続先 (URL/port は Excubitor が特定可能 → 各サービスの個別設定不要)。
    provides:
      CERNERE_URL: http://${host}:${port}
      CERNERE_BASE_URL: http://${host}:${port}
      CERNERE_WS_URL: ws://${host}:${port}
    auto_fix:
      enabled: false  # pnpm v10 構成のハマりで暴走中、 手動で main を安定化させてから再有効化
      agent: claude-code
      max_auto_attempts: 3
      working_dir: ${ARS_ROOT}/Cernere
      branch_prefix: excubitor/auto-fix/
      create_pr: true
      pr_draft: true
  - code: cernere-frontend
    name: Cernere login frontend
    tier: saas
    project_code: cernere
    component: frontend
    port: 5173
    repo: LUDIARS/Cernere
    runtime: node
    cwd: ${ARS_ROOT}/Cernere/frontend
    # setup (scripts/site/setup.mjs) がビルドした frontend/dist を serve/index.mjs で配る
    # (vite preview は本番用ではない)。/api 等は backend へ中継する。待受はループバックだけで、
    # 外からは cloudflared 経由でしか届かない。dev server で使う場合は cernere-frontend-test か npm run dev。
    command: node serve/index.mjs
    allow_hot_reload: false
    depends_on: [cernere]
    autostart: false
    env:
      HOST: 127.0.0.1
      PORT: "5173"
      VITE_BACKEND_URL: http://127.0.0.1:8086
    health:
      type: http
      url: http://127.0.0.1:5173/
      interval_sec: 30
    # CERNERE_FRONTEND_URL はブラウザが開く URL (GLAB の passkey popup / redirect 先。WebAuthn の
    # RP ID もこの origin)。拠点内の http://${host}:${port} を配ると利用者の端末から届かず RP ID も
    # 合わない。本番 Cernere は AWS の 1 拠点だけなので公開 URL を配る
    # (spec/plan/problem_logs/2026-10-12-glab-cernere-connection-after-aws-move.md)。
    provides:
      CERNERE_FRONTEND_URL: https://cr.ai-run-do.com

  # 本社のテスト用 Cernere (spec/setup/hq-test-instance.md)。本番 (cernere) と別の service code にして、
  # Vault の値 (別 DB・別 Redis・新しく作った秘密) を本社だけに閉じる。Vault は service code 単位で
  # 他拠点にも配られるため、cernere の値を本社用に変えると本番に届く (2026-10-09)。
  # ループバック限定 (LISTEN_HOST=127.0.0.1 は Vault のテスト用 project から入る)。provides は持たない。
  - code: cernere-test
    name: Cernere (本社テスト用)
    tier: saas
    project_code: cernere
    component: backend
    port: 8090
    repo: LUDIARS/Cernere
    runtime: node
    cwd: ${ARS_ROOT}/Cernere/server
    command: node --run dev
    allow_hot_reload: true
    autostart: false
    env:
      LISTEN_PORT: "8090"
      CERNERE_PUBLIC_URL: http://127.0.0.1:8090
      FRONTEND_URL: http://127.0.0.1:5174
      CERNERE_COMPOSITE_ALLOWED_ORIGINS: http://localhost:5188,http://127.0.0.1:5188
    health:
      type: http
      url: http://127.0.0.1:8090/health
      interval_sec: 30
  - code: cernere-frontend-test
    name: Cernere login frontend (本社テスト用)
    tier: saas
    project_code: cernere
    component: frontend
    port: 5174
    repo: LUDIARS/Cernere
    runtime: node
    cwd: ${ARS_ROOT}/Cernere/frontend
    command: npm run dev -- --host 127.0.0.1 --port 5174 --strictPort
    allow_hot_reload: true
    depends_on: [cernere-test]
    autostart: false
    env:
      VITE_BACKEND_URL: http://127.0.0.1:8090
    health:
      type: http
      url: http://127.0.0.1:5174/
      interval_sec: 30
