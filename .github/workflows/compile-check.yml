name: CI Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  server-typecheck:
    name: Server TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      # lib/vestigium は file: 依存なので、 server の npm ci より先に dist を作る。
      # --ignore-scripts で prepare を止めてから build するのは、 prepare の npx tsc が
      # node_modules 未展開の状態では解決できないため (scripts/bootstrap.mjs と同じ手順)。
      - name: Build Vestigium submodule
        working-directory: lib/vestigium
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # 認証コア (JWT / PASETO トークンの署名・検証・異常系) の unit テスト。
      # DB/Redis 不要で動く純ロジックのみ。
      - name: Tests
        run: npm test

  frontend-typecheck:
    name: Frontend TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b --noEmit

  packages-typecheck:
    name: Packages TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/env-cli
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
